<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="glow-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#00bcd4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#006080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-outer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="core-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="60" cy="60" r="58" fill="url(#glow-outer)"/>

  <!-- Outer ring with tick marks -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Tick marks around outer ring -->
  <g stroke="#00e5ff" stroke-opacity="0.7">
    <!-- Generate ticks every 12 degrees -->
    <line x1="60" y1="10.5" x2="60" y2="14.5" transform="rotate(0 60 60)" stroke-width="1.5"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(12 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(24 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="14.5" transform="rotate(36 60 60)" stroke-width="1.5"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(48 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(60 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="14.5" transform="rotate(72 60 60)" stroke-width="1.5"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(84 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(96 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="14.5" transform="rotate(108 60 60)" stroke-width="1.5"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(120 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(132 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="14.5" transform="rotate(144 60 60)" stroke-width="1.5"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(156 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(168 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="14.5" transform="rotate(180 60 60)" stroke-width="1.5"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(192 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(204 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="14.5" transform="rotate(216 60 60)" stroke-width="1.5"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(228 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(240 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="14.5" transform="rotate(252 60 60)" stroke-width="1.5"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(264 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(276 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="14.5" transform="rotate(288 60 60)" stroke-width="1.5"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(300 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(312 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="14.5" transform="rotate(324 60 60)" stroke-width="1.5"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(336 60 60)" stroke-width="0.8"/>
    <line x1="60" y1="10.5" x2="60" y2="13" transform="rotate(348 60 60)" stroke-width="0.8"/>
  </g>

  <!-- Dashed inner arc (270 degrees, open bottom-right) -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.6"
    stroke-dasharray="4 3"
    stroke-dashoffset="0"/>

  <!-- Middle ring -->
  <circle cx="60" cy="60" r="26" fill="none" stroke="#00e5ff" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Core glow halo -->
  <circle cx="60" cy="60" r="14" fill="#00bcd4" fill-opacity="0.15" filter="url(#core-glow)"/>

  <!-- Core orb -->
  <circle cx="60" cy="60" r="10" fill="url(#glow-core)" filter="url(#blur-glow)"/>

  <!-- Crosshair lines -->
  <line x1="60" y1="22" x2="60" y2="30" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="60" y1="90" x2="60" y2="98" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="22" y1="60" x2="30" y2="60" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="90" y1="60" x2="98" y2="60" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.5"/>
</svg>
